name: Build Nothing OS 4 Civi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (No Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Signed Debug APK
        run: gradle assembleDebug --no-build-cache

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-OS4-Civi-APK
          path: app/build/outputs/apk/debug/*.apk
