name: Build Kinetic OS 4 Civi APK

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'app/src/main/java/com/pratik/nothingcivi/MainActivity.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (No Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Compile Signed APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Kinetic-OS-4.0-Civi.apk

      - name: Publish Direct .APK File to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v4.0 Kinetic-OS-4.0-Civi.apk --title "Kinetic OS 4.0 Civi APK" --notes "Direct installable Kinetic-OS-4.0-Civi.apk" || gh release upload v4.0 Kinetic-OS-4.0-Civi.apk --clobber
          gh release upload Launcher Kinetic-OS-4.0-Civi.apk --clobber || true

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-OS4-Civi-APK
          path: Kinetic-OS-4.0-Civi.apk