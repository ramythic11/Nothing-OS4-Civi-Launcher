plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pratik.nothingcivi'
    compileSdk 34

    defaultConfig {
        applicationId "com.pratik.nothingcivi"
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName "4.0.7-HomeSettingsMaster"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}